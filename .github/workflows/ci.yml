name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and typecheck
        run: |
          bun run lint
          bun run check-types

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build

  pack:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify package tarball size
        run: |
          npm pack --dry-run --json > pack.json
          node <<'NODE'
          const fs = require('node:fs');
          const [pack] = JSON.parse(fs.readFileSync('pack.json', 'utf8'));
          if (!pack || typeof pack.size !== 'number') {
            throw new Error('npm pack --dry-run did not return a tarball size.');
          }
          console.log(`Tarball: ${pack.filename} (${pack.size} bytes)`);
          if (pack.size > 750000) {
            throw new Error(`Tarball too large: ${pack.size} bytes (limit 750000 bytes).`);
          }
          NODE
