name: CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and typecheck
        run: |
          bun run lint
          bun run check-types

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build

  pack:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify package tarball size
        run: |
          npm pack --dry-run --json > pack-output.txt 2>&1
          node <<'NODE'
          const fs = require('node:fs');
          const output = fs.readFileSync('pack-output.txt', 'utf8');
          const match = output.match(/\[\s*\{[\s\S]*\]\s*$/);
          if (!match) {
            throw new Error('npm pack --dry-run did not emit a parseable JSON payload.');
          }
          const [pack] = JSON.parse(match[0]);
          if (!pack || typeof pack.size !== 'number') {
            throw new Error('npm pack --dry-run did not return a tarball size.');
          }
          console.log(`Tarball: ${pack.filename} (${pack.size} bytes)`);
          if (pack.size > 750000) {
            throw new Error(`Tarball too large: ${pack.size} bytes (limit 750000 bytes).`);
          }
          NODE

  example-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Build package
        run: bun run build
      - name: Install example dependencies
        working-directory: examples/basic
        run: npm install --no-package-lock
      - name: Install Playwright Chromium
        working-directory: examples/basic
        run: npx playwright install --with-deps chromium
      - name: Run example integration test
        run: bun run test:example-basic
